# Compilation automatique de OverLoad.exe sur Windows.
#
# 1. Tests et contrôle de style (job « test »).
# 2. Construction de OverLoad.exe avec PyInstaller, auto-test du fichier produit,
#    sommes de contrôle, puis publication en artefact téléchargeable (job « build »).
#
# L'artefact est disponible dans l'onglet Actions, sur la dernière exécution
# réussie : « OverLoad-windows-portable ». Il n'est pas une version publique.

name: Build Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test:
    name: Style et tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer le projet et les outils de test
        run: python -m pip install -e ".[dev]"
      - name: Vérifier le style
        run: python -m ruff check src tests scripts packaging
      - name: Exécuter les tests
        env:
          OVERLOAD_DATA_DIR: ${{ runner.temp }}\overload-data
        run: python -m pytest -q

  build:
    name: Construire OverLoad.exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer le projet et PyInstaller
        run: python -m pip install -e ".[dev,build]"
      - name: Compiler OverLoad.exe
        run: python -m PyInstaller packaging/overload.spec --noconfirm --distpath dist --workpath build
      - name: Auto-test de l'exécutable
        shell: pwsh
        env:
          OVERLOAD_DATA_DIR: ${{ runner.temp }}\overload-data-selftest
        run: |
          & .\dist\OverLoad.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "L'auto-test d'OverLoad.exe a échoué (code $LASTEXITCODE)." }
      - name: Sommes de contrôle
        shell: pwsh
        run: |
          $exe = Get-Item .\dist\OverLoad.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii .\dist\SHA256SUMS.txt
          Write-Host "SHA-256 : $hash  (taille : $([math]::Round($exe.Length / 1MB, 1)) Mo)"
      - name: Publier l'artefact
        uses: actions/upload-artifact@v5
        with:
          name: OverLoad-windows-portable
          path: |
            dist/OverLoad.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
