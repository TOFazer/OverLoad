name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint et tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer le projet et ses outils de test
        run: python -m pip install -e ".[dev]"
      - name: Vérifier le style et les erreurs
        run: python -m ruff check src tests
      - name: Exécuter les tests
        run: python -m pytest
