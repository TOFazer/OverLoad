name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint et tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer le projet et ses outils de test
        run: python -m pip install -e ".[dev]"
      - name: Vérifier le style et les erreurs
        run: python -m ruff check src tests
      - name: Exécuter les tests
        run: python -m pytest
      - name: Vérifier le démarrage de l'interface hors écran
        shell: pwsh
        run: |
          python -m pip install -e ".[gui]"
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -c "from PySide6.QtWidgets import QApplication; from overload.ui.main import MainWindow; import tempfile; from pathlib import Path; from unittest.mock import patch; app=QApplication([]); d=tempfile.TemporaryDirectory(); p=patch('overload.ui.main.data_directory', return_value=Path(d.name)); p.start(); w=MainWindow(); w.close(); p.stop(); d.cleanup()"
