name: CI & Build Windows (.exe)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build-windows:
    name: Tests & Compilation OverLoad.exe (Windows x64)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer le projet, les outils de test et PyInstaller
        run: python -m pip install -e ".[dev,build]"

      - name: Vérifier le style et la qualité (Ruff)
        run: python -m ruff check src tests scripts

      - name: Préparer FFmpeg et FFprobe LGPL pour le paquet Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_ffmpeg.py

      - name: Exécuter la suite complète de tests (moteur + interface native Qt)
        run: python -m pytest -v

      - name: Générer OverLoad.exe et l'archive portable Windows
        run: python scripts/build_windows.py

      - name: Compiler l'installateur Windows OverLoad-Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc packaging\OverLoad.iss
            $hash = (Get-FileHash dist\OverLoad-Setup.exe -Algorithm SHA256).Hash.ToLower()
            Add-Content -Path dist\SHA256SUMS.txt -Value "$hash  OverLoad-Setup.exe"
          } else {
            Write-Error "Inno Setup introuvable sur l'image Windows."
          }

      - name: Vérifier le démarrage réel de dist\OverLoad.exe (--self-test)
        shell: pwsh
        run: |
          $report = Join-Path $env:TEMP "overload-selftest.json"
          $proc = Start-Process -FilePath "dist\OverLoad.exe" -ArgumentList "--self-test","--self-test-out",$report -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "OverLoad.exe s'est terminé avec le code $($proc.ExitCode)"
          }
          if (-not (Test-Path $report)) {
            throw "Rapport d'auto-test non généré par OverLoad.exe"
          }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if ($json.status -ne "ok") {
            throw "Auto-test OverLoad.exe invalide : $($json | ConvertTo-Json)"
          }
          Write-Host "Auto-test OverLoad.exe réussi !"
          Get-Content dist\SHA256SUMS.txt

      - name: Publier les exécutables Windows (OverLoad.exe & OverLoad-Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: OverLoad-Windows-x64
          path: |
            dist/OverLoad.exe
            dist/OverLoad-Setup.exe
            dist/OverLoad-Portable-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
