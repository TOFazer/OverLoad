name: Release OverLoad.exe

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-windows:
    name: Compilation & publication de la release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
    # Même groupe que la publication depuis l'événement release dans ci.yml :
    # deux exécutions pour un même tag ne doivent pas remplacer les fichiers en parallèle.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Utiliser la version du tag pour le paquet et l'installateur
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/set_release_version.py "$env:RELEASE_TAG"

      - name: Installer le projet, les outils de test et PyInstaller
        run: python -m pip install -e ".[dev,build]"

      - name: Vérifier le style et la qualité (Ruff)
        run: python -m ruff check src tests scripts

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Tester les liens et les états du site de téléchargement
        run: node --test tests/web/releases.test.mjs

      - name: Préparer FFmpeg et FFprobe LGPL pour le paquet Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_ffmpeg.py

      - name: Exécuter la suite complète de tests (moteur + interface native Qt)
        run: python -m pytest -v

      - name: Générer OverLoad.exe et l'archive portable Windows
        run: python scripts/build_windows.py

      - name: Compiler l'installateur Windows OverLoad-Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc packaging\OverLoad.iss
            $hash = (Get-FileHash dist\OverLoad-Setup.exe -Algorithm SHA256).Hash.ToLower()
            Add-Content -Path dist\SHA256SUMS.txt -Value "$hash  OverLoad-Setup.exe"
          } else {
            Write-Error "Inno Setup introuvable sur l'image Windows."
          }

      - name: Vérifier le démarrage réel de dist\OverLoad.exe (--self-test)
        shell: pwsh
        run: |
          $report = Join-Path $env:TEMP "overload-selftest.json"
          $proc = Start-Process -FilePath "dist\OverLoad.exe" -ArgumentList "--self-test","--self-test-out",$report -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "OverLoad.exe s'est terminé avec le code $($proc.ExitCode)"
          }
          if (-not (Test-Path $report)) {
            throw "Rapport d'auto-test non généré par OverLoad.exe"
          }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if ($json.status -ne "ok") {
            throw "Auto-test OverLoad.exe invalide : $($json | ConvertTo-Json)"
          }
          Write-Host "Auto-test OverLoad.exe réussi !"
          Get-Content dist\SHA256SUMS.txt
          foreach ($line in Get-Content dist\SHA256SUMS.txt) {
            $expected, $file = $line -split '  ', 2
            $actual = (Get-FileHash (Join-Path dist $file) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "Empreinte SHA-256 incorrecte : $file" }
          }

      - name: Publier la release GitHub avec les exécutables
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=(dist/OverLoad.exe dist/OverLoad-Setup.exe dist/OverLoad-Portable-win64.zip dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "OverLoad $RELEASE_TAG" --generate-notes \
              "${options[@]}" "${files[@]}"
          fi
