[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overload"
version = "1.3.0"
description = "OverLoad — outils multimédias pour Windows (téléchargement, bibliothèque, analyse, conversion)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6.10"]

[project.scripts]
overload = "overload.__main__:main"

[project.gui-scripts]
overload-gui = "overload.exe_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"overload.ui.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
